<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi-LLM Validator Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }
        
        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }
        
        .header p {
            font-size: 1.1em;
            opacity: 0.9;
        }
        
        .dashboard {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }
        
        .card {
            background: white;
            border-radius: 10px;
            padding: 25px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        
        .card.full {
            grid-column: 1 / -1;
        }
        
        .card h2 {
            color: #333;
            margin-bottom: 20px;
            font-size: 1.5em;
        }
        
        .form-group {
            margin-bottom: 15px;
        }
        
        label {
            display: block;
            margin-bottom: 5px;
            color: #555;
            font-weight: 500;
        }
        
        textarea, input, select {
            width: 100%;
            padding: 10px;
            border: 2px solid #e0e0e0;
            border-radius: 5px;
            font-size: 14px;
            font-family: inherit;
            transition: border-color 0.3s;
        }
        
        textarea {
            min-height: 120px;
            resize: vertical;
        }
        
        textarea:focus, input:focus, select:focus {
            outline: none;
            border-color: #667eea;
        }
        
        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 5px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        }
        
        .btn:active {
            transform: translateY(0);
        }
        
        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        
        .result {
            margin-top: 20px;
            padding: 15px;
            border-radius: 5px;
            background: #f5f5f5;
        }
        
        .result.success {
            background: #d4edda;
            border: 1px solid #c3e6cb;
            color: #155724;
        }
        
        .result.error {
            background: #f8d7da;
            border: 1px solid #f5c6cb;
            color: #721c24;
        }
        
        .score-display {
            display: flex;
            justify-content: space-around;
            margin: 20px 0;
        }
        
        .score-item {
            text-align: center;
        }
        
        .score-value {
            font-size: 2em;
            font-weight: bold;
            color: #667eea;
        }
        
        .score-label {
            color: #666;
            margin-top: 5px;
        }
        
        .heuristic-scores {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 10px;
            margin-top: 15px;
        }
        
        .heuristic-item {
            padding: 10px;
            background: #f8f9fa;
            border-radius: 5px;
            border-left: 4px solid #667eea;
        }
        
        .heuristic-name {
            font-weight: 600;
            color: #333;
            margin-bottom: 5px;
        }
        
        .heuristic-score {
            font-size: 1.2em;
            color: #667eea;
        }
        
        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255,255,255,.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s ease-in-out infinite;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        
        .tab {
            padding: 10px 20px;
            background: rgba(255,255,255,0.2);
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: 500;
            transition: background 0.3s;
        }
        
        .tab.active {
            background: white;
            color: #667eea;
        }
        
        .tab-content {
            display: none;
        }
        
        .tab-content.active {
            display: block;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🤖 Multi-LLM Validator</h1>
            <p>Production-grade validation system with genetic optimization</p>
        </div>
        
        <div class="tabs">
            <button class="tab active" onclick="switchTab('validate')">Validate</button>
            <button class="tab" onclick="switchTab('generate')">Generate & Validate</button>
            <button class="tab" onclick="switchTab('revise')">Revise Loop</button>
            <button class="tab" onclick="switchTab('train')">Train</button>
            <button class="tab" onclick="switchTab('evolve')">Evolve</button>
        </div>
        
        <!-- Validate Tab -->
        <div id="validate-tab" class="tab-content active">
            <div class="dashboard">
                <div class="card full">
                    <h2>📝 Validate Text</h2>
                    <div class="form-group">
                        <label for="validate-text">Text to Validate</label>
                        <textarea id="validate-text" placeholder="Enter text to validate..."></textarea>
                    </div>
                    <div class="form-group">
                        <label for="validate-prompt">Original Prompt (Optional)</label>
                        <input type="text" id="validate-prompt" placeholder="Enter the original prompt...">
                    </div>
                    <button class="btn" onclick="validateText()">
                        <span id="validate-btn-text">Validate</span>
                    </button>
                    <div id="validate-result"></div>
                </div>
            </div>
        </div>
        
        <!-- Generate Tab -->
        <div id="generate-tab" class="tab-content">
            <div class="dashboard">
                <div class="card full">
                    <h2>✨ Generate & Validate</h2>
                    <div class="form-group">
                        <label for="generate-prompt">Prompt</label>
                        <textarea id="generate-prompt" placeholder="Enter your prompt..."></textarea>
                    </div>
                    <div class="form-group">
                        <label for="generate-model">Model (Optional)</label>
                        <input type="text" id="generate-model" placeholder="e.g., gpt-4o-mini">
                    </div>
                    <button class="btn" onclick="generateText()">
                        <span id="generate-btn-text">Generate & Validate</span>
                    </button>
                    <div id="generate-result"></div>
                </div>
            </div>
        </div>
        
        <!-- Revise Tab -->
        <div id="revise-tab" class="tab-content">
            <div class="dashboard">
                <div class="card full">
                    <h2>🔄 Revise Loop</h2>
                    <div class="form-group">
                        <label for="revise-prompt">Prompt</label>
                        <textarea id="revise-prompt" placeholder="Enter your prompt..."></textarea>
                    </div>
                    <div class="form-group">
                        <label for="revise-threshold">Quality Threshold</label>
                        <input type="number" id="revise-threshold" value="0.8" min="0" max="1" step="0.1">
                    </div>
                    <button class="btn" onclick="reviseText()">
                        <span id="revise-btn-text">Start Revision Loop</span>
                    </button>
                    <div id="revise-result"></div>
                </div>
            </div>
        </div>
        
        <!-- Train Tab -->
        <div id="train-tab" class="tab-content">
            <div class="dashboard">
                <div class="card full">
                    <h2>🎓 Train Validator</h2>
                    <p style="margin-bottom: 20px; color: #666;">Optimize validator weights using training datasets.</p>
                    <div class="form-group">
                        <label for="train-epochs">Epochs</label>
                        <input type="number" id="train-epochs" value="10" min="1" max="100">
                    </div>
                    <button class="btn" onclick="startTraining()">
                        <span id="train-btn-text">Start Training</span>
                    </button>
                    <div id="train-result"></div>
                </div>
            </div>
        </div>
        
        <!-- Evolve Tab -->
        <div id="evolve-tab" class="tab-content">
            <div class="dashboard">
                <div class="card full">
                    <h2>🧬 Genetic Evolution</h2>
                    <p style="margin-bottom: 20px; color: #666;">Use genetic algorithms to optimize validator configuration.</p>
                    <div class="form-group">
                        <label for="evolve-population">Population Size</label>
                        <input type="number" id="evolve-population" value="20" min="5" max="100">
                    </div>
                    <div class="form-group">
                        <label for="evolve-generations">Generations</label>
                        <input type="number" id="evolve-generations" value="50" min="10" max="200">
                    </div>
                    <button class="btn" onclick="startEvolution()">
                        <span id="evolve-btn-text">Start Evolution</span>
                    </button>
                    <div id="evolve-result"></div>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        const API_BASE = 'http://localhost:8000';
        
        function switchTab(tab) {
            // Hide all tabs
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            
            // Show selected tab
            document.getElementById(`${tab}-tab`).classList.add('active');
            event.target.classList.add('active');
        }
        
        function setLoading(btnId, isLoading) {
            const btn = document.getElementById(btnId);
            if (isLoading) {
                btn.innerHTML = '<span class="loading"></span>';
                btn.disabled = true;
            } else {
                btn.innerHTML = btn.id.replace('-btn-text', '').replace('-', ' ').replace(/\b\w/g, l => l.toUpperCase());
                btn.disabled = false;
            }
        }
        
        function displayResult(elementId, data, isError = false) {
            const resultDiv = document.getElementById(elementId);
            resultDiv.className = `result ${isError ? 'error' : 'success'}`;
            
            if (isError) {
                resultDiv.innerHTML = `<strong>Error:</strong> ${data}`;
                return;
            }
            
            let html = '';
            
            if (data.score !== undefined) {
                html += `
                    <div class="score-display">
                        <div class="score-item">
                            <div class="score-value">${(data.score * 100).toFixed(1)}%</div>
                            <div class="score-label">Overall Score</div>
                        </div>
                        <div class="score-item">
                            <div class="score-value">${data.passed ? '✓' : '✗'}</div>
                            <div class="score-label">Status</div>
                        </div>
                    </div>
                `;
                
                if (data.heuristic_scores) {
                    html += '<h3>Heuristic Scores</h3><div class="heuristic-scores">';
                    for (const [name, score] of Object.entries(data.heuristic_scores)) {
                        html += `
                            <div class="heuristic-item">
                                <div class="heuristic-name">${name.replace('_', ' ')}</div>
                                <div class="heuristic-score">${(score * 100).toFixed(1)}%</div>
                            </div>
                        `;
                    }
                    html += '</div>';
                }
            }
            
            if (data.text) {
                html += `<h3>Generated Text</h3><div style="padding: 10px; background: white; border-radius: 5px; margin-top: 10px;">${data.text}</div>`;
            }
            
            if (data.revision_history) {
                html += '<h3>Revision History</h3><div style="margin-top: 10px;">';
                data.revision_history.forEach(r => {
                    html += `<div style="padding: 5px;">Revision ${r.revision}: ${(r.score * 100).toFixed(1)}% ${r.passed ? '✓' : '✗'}</div>`;
                });
                html += '</div>';
            }
            
            if (data.status) {
                html += `<div style="margin-top: 10px;"><strong>Status:</strong> ${data.status}</div>`;
            }
            
            if (data.message) {
                html += `<div style="margin-top: 10px;">${data.message}</div>`;
            }
            
            resultDiv.innerHTML = html || '<pre>' + JSON.stringify(data, null, 2) + '</pre>';
        }
        
        async function validateText() {
            const text = document.getElementById('validate-text').value;
            const prompt = document.getElementById('validate-prompt').value;
            
            if (!text) {
                alert('Please enter text to validate');
                return;
            }
            
            setLoading('validate-btn-text', true);
            
            try {
                const response = await fetch(`${API_BASE}/validate/single`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({text, prompt: prompt || null})
                });
                
                const data = await response.json();
                displayResult('validate-result', data, !response.ok);
            } catch (error) {
                displayResult('validate-result', error.message, true);
            } finally {
                setLoading('validate-btn-text', false);
            }
        }
        
        async function generateText() {
            const prompt = document.getElementById('generate-prompt').value;
            const model = document.getElementById('generate-model').value;
            
            if (!prompt) {
                alert('Please enter a prompt');
                return;
            }
            
            setLoading('generate-btn-text', true);
            
            try {
                const response = await fetch(`${API_BASE}/validate/generate`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({prompt, model: model || null})
                });
                
                const data = await response.json();
                displayResult('generate-result', data.validation ? {...data.validation, text: data.text} : data, !response.ok);
            } catch (error) {
                displayResult('generate-result', error.message, true);
            } finally {
                setLoading('generate-btn-text', false);
            }
        }
        
        async function reviseText() {
            const prompt = document.getElementById('revise-prompt').value;
            const threshold = document.getElementById('revise-threshold').value;
            
            if (!prompt) {
                alert('Please enter a prompt');
                return;
            }
            
            setLoading('revise-btn-text', true);
            
            try {
                const response = await fetch(`${API_BASE}/validate/revise`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({prompt, quality_threshold: parseFloat(threshold)})
                });
                
                const data = await response.json();
                displayResult('revise-result', {...data.validation, text: data.text, revision_history: data.revision_history}, !response.ok);
            } catch (error) {
                displayResult('revise-result', error.message, true);
            } finally {
                setLoading('revise-btn-text', false);
            }
        }
        
        async function startTraining() {
            const epochs = document.getElementById('train-epochs').value;
            
            setLoading('train-btn-text', true);
            
            try {
                const response = await fetch(`${API_BASE}/train/run`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({epochs: parseInt(epochs), background: true})
                });
                
                const data = await response.json();
                displayResult('train-result', data, !response.ok);
            } catch (error) {
                displayResult('train-result', error.message, true);
            } finally {
                setLoading('train-btn-text', false);
            }
        }
        
        async function startEvolution() {
            const population = document.getElementById('evolve-population').value;
            const generations = document.getElementById('evolve-generations').value;
            
            setLoading('evolve-btn-text', true);
            
            try {
                const response = await fetch(`${API_BASE}/evolve/run`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        population_size: parseInt(population),
                        generations: parseInt(generations),
                        background: true
                    })
                });
                
                const data = await response.json();
                displayResult('evolve-result', data, !response.ok);
            } catch (error) {
                displayResult('evolve-result', error.message, true);
            } finally {
                setLoading('evolve-btn-text', false);
            }
        }
    </script>
</body>
</html>
